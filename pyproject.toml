[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "remote-job-agent"
version = "0.1.0"
description = "Zero-cost, local-first remote job discovery and application preparation agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "feedparser>=6.0.11,<7",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
firebase = ["firebase-admin>=6.5,<8"]

[project.scripts]
remote-job-agent = "remote_job_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/remote_job_agent"]
